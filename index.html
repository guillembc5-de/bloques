<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloques</title>
<style>
  :root { --bg:#f5f3ee; --cell:#e4e0d6; --ink:#2b2b2b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  h1 { font-weight: 600; letter-spacing: .05em; margin: 0; }
  p { margin: 0; opacity: .6; }
  #board {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
    width: min(90vw, 380px); aspect-ratio: 1;
  }
  .cell { background: var(--cell); border-radius: 6px; }
</style>
</head>
<body>
  <h1>Bloques</h1>
  <div id="board"></div>
  <p>Fase 1: la publicación funciona ✔</p>
  <script>
    const board = document.getElementById('board');
    for (let i = 0; i < 64; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      board.appendChild(c);
    }
  </script>
</body>
</html>
